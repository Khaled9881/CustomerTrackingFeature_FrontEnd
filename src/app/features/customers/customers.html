<section class="customers-page" aria-labelledby="customers-title">
  <header class="customers-heading">
    <div class="heading-copy">
      <p class="eyebrow">CUSTOMER OPERATIONS / DIRECTORY</p>
      <h1 id="customers-title">Customers</h1>
      <p class="page-intro">Customer records, locations, and contact coverage.</p>
    </div>
    <div class="customer-actions">
      <button class="btn btn-outline-primary" (click)="openNearestModal()">
        Find Nearby Customers
      </button>
      <button class="btn btn-outline-primary" (click)="openViewAllModal()">View All on Map</button>
      <button class="btn btn-primary" (click)="openAddModal()">+ Add Customer</button>
    </div>
  </header>

  <section class="directory-toolbar" aria-label="Customer list controls">
    <div class="view-switch" role="group" aria-label="Customer view">
      <button
        type="button"
        [class.active]="viewMode() === 'table'"
        [attr.aria-pressed]="viewMode() === 'table'"
        (click)="setViewMode('table')"
      >
        Table
      </button>
      <button
        type="button"
        [class.active]="viewMode() === 'card'"
        [attr.aria-pressed]="viewMode() === 'card'"
        (click)="setViewMode('card')"
      >
        Cards
      </button>
    </div>
    <p class="record-count">
      <strong>{{ totalCount() }}</strong> customer records
    </p>
  </section>

  <section class="customer-results" aria-label="Customer records">
    @if (viewMode() === 'table') {
      <app-customer-table
        [customers]="customers()"
        (viewDetails)="onViewDetails($event)"
        (viewLocation)="onViewLocation($event)"
        (getDirections)="onGetDirections($event)"
      ></app-customer-table>
    } @else {
      <app-customer-card-list
        [customers]="customers()"
        (viewDetails)="onViewDetails($event)"
        (viewLocation)="onViewLocation($event)"
        (getDirections)="onGetDirections($event)"
      ></app-customer-card-list>
    }
  </section>

  <app-pagination
    [currentPage]="currentPage()"
    [totalCount]="totalCount()"
    [pageSize]="pageSize"
    (pageChange)="goToPage($event)"
  ></app-pagination>
</section>

<app-view-location-modal
  [isOpen]="isLocationModalOpen()"
  [customer]="selectedLocationCustomer()"
  (closed)="onLocationModalClosed()"
></app-view-location-modal>

<app-nearest-customers-modal
  [isOpen]="isNearestModalOpen()"
  (closed)="onNearestModalClosed()"
></app-nearest-customers-modal>

<app-view-all-map-modal
  [isOpen]="isViewAllModalOpen()"
  (closed)="onViewAllModalClosed()"
></app-view-all-map-modal>

<app-add-customer-modal
  [isOpen]="isAddModalOpen()"
  (closed)="onModalClosed()"
  (customerAdded)="onCustomerAdded()"
></app-add-customer-modal>

<app-customer-detail-modal
  [customerId]="selectedCustomerId()"
  [isOpen]="isDetailModalOpen()"
  (closed)="onDetailModalClosed()"
  (imagesChanged)="onImagesChanged()"
></app-customer-detail-modal>
