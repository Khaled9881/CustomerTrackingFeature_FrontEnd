<div class="customer-card-grid">
  @for (customer of customers; track customer.id) {
    <article class="customer-card">
      <div class="customer-card-media">
        @if (customer.mainImagePath) {
          <img [src]="customer.mainImagePath" [alt]="customer.name" />
        } @else {
          <span aria-label="No customer photo">{{ customer.name.charAt(0) }}</span>
        }
      </div>
      <div class="customer-card-body">
        <p class="eyebrow">{{ customer.governorateName }}</p>
        <h2>{{ customer.name }}</h2>
        <p class="customer-card-location">{{ customer.cityName }}</p>
        <div class="customer-card-actions">
          <button class="btn btn-sm btn-outline-primary" (click)="onViewDetails(customer.id)">
            Details
          </button>
          <button class="btn btn-sm btn-outline-secondary" (click)="onViewLocation(customer)">
            Location
          </button>
          <button class="btn btn-sm btn-outline-success" (click)="onGetDirections(customer)">
            Directions
          </button>
        </div>
      </div>
    </article>
  } @empty {
    <div class="customer-card-empty">
      <strong>No customer records yet</strong>
      <span>New records will appear here.</span>
    </div>
  }
</div>
