<table class="table table-hover align-middle">
  <thead class="table-light">
    <tr>
      <th style="width: 80px">Image</th>
      <th>Name</th>
      <th>Governorate</th>
      <th>City</th>
      <th style="width: 220px">Actions</th>
    </tr>
  </thead>
  <tbody>
    @for (customer of customers; track customer.id) {
      <tr>
        <td>
          @if (customer.mainImagePath) {
            <img
              [src]="customer.mainImagePath"
              [alt]="customer.name"
              class="rounded"
              style="width: 50px; height: 50px; object-fit: cover"
            />
          } @else {
            <div
              class="bg-secondary rounded d-flex align-items-center justify-content-center text-white"
              style="width: 50px; height: 50px; font-size: 0.7rem"
            >
              No Img
            </div>
          }
        </td>
        <td>{{ customer.name }}</td>
        <td>{{ customer.governorateName }}</td>
        <td>{{ customer.cityName }}</td>
        <td>
          <button class="btn btn-sm btn-outline-primary me-1" (click)="onViewDetails(customer.id)">
            Details
          </button>
          <button class="btn btn-sm btn-outline-secondary me-1" (click)="onViewLocation(customer)">
            📍 Location
          </button>
          <button class="btn btn-sm btn-outline-success" (click)="onGetDirections(customer)">
            🧭 Directions
          </button>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="5" class="text-center text-muted py-4">No customers found.</td>
      </tr>
    }
  </tbody>
</table>
