<div class="app-shell">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand-lockup" routerLink="/home" aria-label="Customer Tracking home">
        <span class="brand-mark" aria-hidden="true">CT</span>
        <span class="brand-copy">
          <strong>Customer Tracking</strong>
          <small>FIELD OPERATIONS</small>
        </span>
      </a>

      <nav class="primary-nav" aria-label="Primary navigation">
        <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <span>01</span>Overview
        </a>
        <a routerLink="/customers" routerLinkActive="active"> <span>02</span>Customers </a>

  <main class="app-main">

  <footer class="app-footer">
